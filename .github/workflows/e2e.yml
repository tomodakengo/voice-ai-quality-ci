name: e2e

# headless Chromium + fake audio による音声入力E2E。mock ASR なので実APIキー不要。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    env:
      USE_MOCK_ASR: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright ブラウザ導入
        run: npx playwright install --with-deps chromium
      - name: テスト用WAVフィクスチャ生成(合成トーン, ffmpeg不要)
        run: npm run gen:wav
      - name: E2E(fake audio, headless)
        run: npm run e2e
      - name: アーティファクト保存(report / trace / screenshot)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
