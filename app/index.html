<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>音声コマンド PoC — AmiVoice × LLM</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
      h1 { font-size: 1.3rem; }
      button { font-size: 1rem; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; }
      #record[data-state="recording"] { background: #d33; color: #fff; }
      .panel { border: 1px solid #8884; border-radius: 10px; padding: 1rem; margin-top: 1rem; }
      .label { font-size: 0.8rem; opacity: 0.7; }
      #transcript { font-size: 1.2rem; min-height: 1.6rem; }
      #interim { opacity: 0.55; }
      pre { background: #8881; padding: 0.6rem; border-radius: 6px; overflow-x: auto; }
      .status { font-size: 0.8rem; opacity: 0.7; }
    </style>
  </head>
  <body>
    <h1>音声コマンド PoC</h1>
    <p class="status">マイク → AmiVoice WebSocket → 認識結果 → LLM構造化抽出。<span id="mode"></span></p>

    <button id="record" data-state="idle">🎙 録音開始</button>

    <div class="panel">
      <div class="label">認識結果(確定)</div>
      <div id="transcript" data-testid="transcript"></div>
      <div id="interim" data-testid="interim"></div>
    </div>

    <div class="panel">
      <div class="label">LLM 抽出アクション(JSON)</div>
      <pre id="action" data-testid="action">—</pre>
    </div>

    <div class="panel">
      <div class="label">ステータス</div>
      <div id="log" data-testid="log" class="status"></div>
    </div>

    <script src="/main.js"></script>
  </body>
</html>
